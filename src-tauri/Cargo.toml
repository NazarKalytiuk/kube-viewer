[package]
name = "kube-viewer"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "KubeViewer — fast native Kubernetes cluster viewer"
license = "MIT"
publish = false

[lib]
name = "kube_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.9", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# In-app updates from GitHub Releases (minisign-verified) and relaunch after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
kube = { version = "5.1", default-features = false, features = [
    "client",
    "config",
    "runtime",
    "rustls-tls",
    "ring",
    "oauth",
    "oidc",
    "gzip",
    "http-proxy",
] }
# Minimum Kubernetes API compiled against; newer servers stay compatible.
k8s-openapi = { version = "0.29", features = ["v1_33"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.2"
thiserror = "2"
regex = "1.13"
# Same version k8s-openapi uses for timestamps; used to parse/format log times.
jiff = { version = "0.2.46", features = ["tz-system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
